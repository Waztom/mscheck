<!DOCTYPE html>
<html>
<head>
    <title>{{REPORT_TITLE}}</title>
    <meta charset="utf-8">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .plot-container {
            margin-top: 20px;
        }
        .instructions {
            margin: 20px 0;
            padding: 10px;
            background-color: #f0f8ff;
            border-left: 5px solid #1e90ff;
        }
        #mz-spectrum-display {
            margin-top: 40px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{REPORT_TITLE}}</h1>
        
        <div class="instructions">
            <p><strong>Interactive TIC Explorer</strong></p>
            <p>Click on any point in the chromatogram to view the closest mass spectrum.</p>
        </div>
        
        <div class="plot-container" id="main-plot"></div>
        
        <div id="mz-spectrum-display">
            <h3>Click on the TIC plot above to view mass spectra</h3>
        </div>
    </div>
    
    <script>
        // Mass spectra data
        const massSpectra = {{MASS_SPECTRA_JSON}};
        
        // Plot data
        const plotData = {{PLOT_JSON}};
        
        // Initialize the plot
        Plotly.newPlot('main-plot', plotData.data, plotData.layout);
    </script>
    
    <!-- Include the external spectrum lookup script -->
    <script>
        {{SPECTRUM_SCRIPT}}
    </script>
</body>
</html>
