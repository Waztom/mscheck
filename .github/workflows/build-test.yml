name: build test

on:
  push:
    branches:
      - "master"
      - "staging"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MSCheck and dependencies
        run: pip install .
      - name: Run tests
        run: python -m unittest discover
